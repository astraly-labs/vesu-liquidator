[package]
name = "vesu-liquidator"
version = "0.5.3"
edition = "2024"
license = "MIT"
homepage = "https://www.vesu.xyz/"
repository = "https://github.com/astraly-labs/Vesu-liquidator"
description = "Liquidator bot for the Vesu Protocol"
readme = "README.md"
keywords = ["vesu", "liquidator", "bot", "starknet"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bigdecimal = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
colored = "2"
dashmap = "6"
dotenvy = "0.15"
futures-util = "0.3"
lazy_static = "1.5"
prost = "0.13"
tonic = "0.14"
reqwest = { version = "0.12", features = ["json"] }
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
starknet-rust = { version = "0.18.0" }
strum = { version = "0.26", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "local-time",
] }
url = "2"

apibara-dna-protocol = "2"
apibara-dna-sdk = { version = "2", features = ["starknet"] }
